plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}
version = '1.0.0'
group = 'pl.voicechatmusic'
base { archivesName = 'voicechat-music-player' }

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.8'
    mappings 'net.fabricmc:yarn:1.21.8+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.133.4+1.21.8'
    modCompileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.35'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
